name: joke
on:
  schedule:
    - cron: "*/10 * * * *"   # 11:50 по Тюмени (UTC+5); скрипт дожидается 12:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  joke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python job.py joke
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save joke history
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add jokes_state.json || true
          git diff --cached --quiet || (git commit -m "joke history" && git pull --rebase && git push)
