name: morning
on:
  schedule:
    - cron: "50 2 * * *"   # 07:50 по Тюмени (UTC+5); скрипт дожидается 08:00
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: playwright install --with-deps chromium
      - run: python job.py morning
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          MODEUS_LOGIN: ${{ secrets.MODEUS_LOGIN }}
          MODEUS_PASSWORD: ${{ secrets.MODEUS_PASSWORD }}
          TTS_COOKIE: ${{ secrets.TTS_COOKIE }}
