<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code-bot</title>
<style>
  :root {
    --primary-color: #2563eb;
    --primary-color-hover: #1d4ed8;
    --danger-color: #dc2626;
    --bg-color: #f0f4f8;
    --chat-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .chat-container {
    width: 450px;
    height: 450px;
    background-color: #ffffff;
    border: 2px solid #1e3a8a;
    box-shadow: 0 8px 24px rgba(30, 58, 138, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .chat-header {
    background-color: #1e40af;
    color: #ffffff;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #1d4ed8;
    justify-content: space-between;
    flex-shrink: 0;
    height: 48px;
  }

  .chat-header .status-dot {
    width: 8px;
    height: 8px;
    background-color: #10b981;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .chat-header .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    min-width: 0;
  }

  .chat-header .progress-badge {
    font-size: 11px;
    font-weight: 400;
    background: rgba(255,255,255,0.15);
    padding: 3px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .chat-header .end-session-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .chat-header .end-session-btn:hover {
    background: rgba(255,255,255,0.15);
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    background-color: #f8fafc;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .chat-messages::-webkit-scrollbar {
    width: 6px;
  }
  .chat-messages::-webkit-scrollbar-thumb {
    background-color: #cbd5e1;
    border-radius: 3px;
  }

  .message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    position: relative;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .message.bot {
    background-color: #e0f2fe;
    color: #0369a1;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .message.bot.support-menu {
    background-color: #f0f9ff;
    border-left: 3px solid #2563eb;
    max-width: 85%;
  }

  .message.bot.support-menu button {
    font-family: inherit;
  }

  .message.user {
    background-color: #2563eb;
    color: #ffffff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .message-time {
    font-size: 10px;
    margin-top: 4px;
    text-align: right;
    opacity: 0.7;
    display: block;
  }

  .chat-input-area {
    display: flex;
    padding: 12px;
    background-color: #ffffff;
    border-top: 1px solid #e2e8f0;
    gap: 8px;
    flex-shrink: 0;
  }

  .chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    min-width: 0;
  }

  .chat-input:focus {
    border-color: #2563eb;
  }

  .chat-submit {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 0 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s;
    flex-shrink: 0;
  }

  .chat-submit:hover {
    background-color: #1d4ed8;
  }

  .screen-container {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 16px 20px;
    text-align: center;
    background: #f8fafc;
    gap: 10px;
    overflow-y: auto;
    min-height: 0;
  }

  .screen-container::-webkit-scrollbar {
    width: 6px;
  }
  .screen-container::-webkit-scrollbar-thumb {
    background-color: #cbd5e1;
    border-radius: 3px;
  }

  .screen-container h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 2px;
  }

  .screen-container p {
    font-size: 14px;
    color: var(--text-main);
    line-height: 1.4;
  }

  .screen-container input {
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    width: 200px;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }

  .screen-container input:focus {
    border-color: var(--primary-color);
  }

  .btn-primary {
    padding: 9px 18px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-primary:hover {
    background-color: var(--primary-color-hover);
  }

  .btn-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-secondary {
    padding: 9px 18px;
    background-color: #e2e8f0;
    color: var(--text-main);
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-secondary:hover {
    background-color: #cbd5e1;
  }

  .topic-button {
    padding: 8px 16px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
    transition: background-color 0.2s;
    flex-shrink: 0;
  }

  .topic-button:hover {
    background-color: var(--primary-color-hover);
  }

  #questionContainer {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #ffffff;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(30, 58, 138, 0.25);
    width: 85%;
    max-width: 340px;
    text-align: center;
    z-index: 10;
    border: 1px solid var(--border-color);
  }

  #questionContainer p {
    font-size: 14px;
    margin-bottom: 16px;
    color: var(--text-main);
    line-height: 1.4;
  }

  #questionContainer .btn-group {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  #questionBtn {
    padding: 9px 16px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
    transition: background-color 0.2s;
  }

  #questionBtn:hover {
    background-color: var(--primary-color-hover);
  }

  #questionBtnNo {
    padding: 9px 16px;
    background-color: #e2e8f0;
    color: var(--text-main);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
    transition: background-color 0.2s;
  }

  #questionBtnNo:hover {
    background-color: #cbd5e1;
  }

  .hidden {
    display: none !important;
  }

  #pinErrorToast {
    display: none;
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
    z-index: 20;
    white-space: nowrap;
  }

  #pinErrorToast.show {
    display: block;
    animation: fadeInOut 2.5s ease forwards;
  }

  @keyframes fadeInOut {
    0%   { opacity: 0; transform: translateX(-50%) translateY(-6px); }
    15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    85%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
  }
</style>
</head>
<body>

<div class="chat-container" id="appContainer" oncontextmenu="return false;">

  <div class="chat-header">
    <div class="header-left">
      <span class="status-dot"></span>
      <span>Code-bot</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="progress-badge hidden" id="progressBadge"></span>
      <button class="end-session-btn hidden" id="endSessionBtn" onclick="endSession()">Завершить</button>
    </div>
  </div>

  <div class="chat-messages hidden" id="chatMessages"></div>

  <div class="screen-container" id="nameConfirmContainer">
    <p id="nameConfirmQuestion"></p>
    <div class="btn-group">
      <button class="btn-primary" onclick="confirmName(true)">Да</button>
      <button class="btn-secondary" onclick="confirmName(false)">Нет</button>
    </div>
  </div>

  <div class="screen-container" id="pinInputContainer">
    <h3>Введите PIN-код:</h3>
    <input type="password" id="pinInput" maxlength="4" placeholder="••••" inputmode="numeric" />
    <button class="btn-primary" onclick="submitPIN()">Подтвердить</button>
  </div>

  <div class="screen-container" id="topicSelectionContainer">
    <h3>Выберите тему для обсуждения:</h3>
    <div id="topicButtonsList" style="display:flex; flex-direction:column; align-items:center; width:100%; gap:8px;"></div>
  </div>

  <div class="chat-input-area hidden" id="chatInputArea">
    <input type="text" class="chat-input" id="userInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
    <button class="chat-submit" onclick="sendMessage()">Отправить</button>
  </div>

  <div id="questionContainer">
    <p id="questionText"></p>
    <div class="btn-group">
      <button id="questionBtn" onclick="confirmStartTopic(true)">Да, начать</button>
      <button id="questionBtnNo" onclick="confirmStartTopic(false)">Нет, назад</button>
    </div>
  </div>

  <div id="pinErrorToast">Неверный PIN-код. Возврат на начальный экран…</div>

</div>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12') { e.preventDefault(); return; }
  if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) {
    e.preventDefault(); return;
  }
  if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
    e.preventDefault(); return;
  }
});

let dialogueHistory = [];
let stage = "initial";
let selectedTopic = "";
let currentDatabase = null;
let currentQuestionIndex = 0;
let errorCount = 0;
let confusedCount = 0;
let botReplyCount = 0;
let skipOffered = false;
let probeStage = 0;
let probeQuestions = [];


window.onload = () => {
  buildTopicButtons();
  resetApp();
};

function buildTopicButtons() {
  const container = document.getElementById('topicButtonsList');
  container.innerHTML = '';

  const order = ['text_data', 'conditional', 'loops', 'sets', 'strings'];
  order.forEach(key => {
    const db = DATABASES[key];
    if (!db) return;
    const btn = document.createElement('button');
    btn.className = 'topic-button';
    btn.textContent = db.topicName;
    btn.onclick = () => selectTopic(key);
    container.appendChild(btn);
  });
}

function resetApp() {
  dialogueHistory = [];
  selectedTopic = "";
  currentDatabase = null;
  currentQuestionIndex = 0;
  errorCount = 0;
  botReplyCount = 0;
  skipOffered = false;
  probeStage = 0;
  probeQuestions = [];
  confusedCount = 0;
  stage = "confirm";

  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('chatMessages').classList.add('hidden');
  document.getElementById('questionContainer').style.display = 'none';
  document.getElementById('pinInput').value = '';
  document.getElementById('userInput').value = '';
  document.getElementById('endSessionBtn').classList.add('hidden');
  document.getElementById('chatInputArea').classList.add('hidden');
  document.getElementById('progressBadge').classList.add('hidden');
  document.getElementById('progressBadge').textContent = '';

  document.getElementById('nameConfirmQuestion').textContent = `Ваше имя ${predefinedName}?`;

  showScreen('nameConfirmContainer');
}

function showScreen(screenId) {
  document.querySelectorAll('.screen-container').forEach(el => el.style.display = 'none');
  document.getElementById('chatInputArea').classList.add('hidden');
  document.getElementById('chatMessages').classList.add('hidden');

  if (screenId) {
    const el = document.getElementById(screenId);
    if (el) el.style.display = 'flex';
  } else {
    document.getElementById('chatMessages').classList.remove('hidden');
    document.getElementById('chatInputArea').classList.remove('hidden');
  }

  if (screenId === null) {
    document.getElementById('endSessionBtn').classList.remove('hidden');
    if (currentDatabase) {
      document.getElementById('progressBadge').classList.remove('hidden');
      updateProgress();
    }
  } else {
    document.getElementById('endSessionBtn').classList.add('hidden');
    document.getElementById('progressBadge').classList.add('hidden');
  }
}

function updateProgress() {
  if (!currentDatabase) return;
  const total = currentDatabase.questions.length;
  document.getElementById('progressBadge').textContent =
    `Вопрос ${currentQuestionIndex + 1} из ${total}`;
}

function confirmName(isYes) {
  if (isYes) {
    showScreen('pinInputContainer');
    stage = "pin";
  } else {
    showScreen(null);
    stage = "chat";
    appendMessage("Code-bot", "Сессия невозможна.", 'bot');
  }
}

function submitPIN() {
  const pin = document.getElementById('pinInput').value.trim();
  if (!pin) { alert('Пожалуйста, введите PIN.'); return; }

  if (pin !== predefinedPIN) {
    showPinError();
    setTimeout(() => resetApp(), 1200);
    return;
  }

  document.getElementById('pinInput').value = '';
  startDialog();
}

function showPinError() {
  const toast = document.getElementById('pinErrorToast');
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
}

function startDialog() {
  stage = "topic";
  showScreen(null);
  document.getElementById('chatMessages').innerHTML = '';
  appendMessage("Code-bot",
    `Здравствуйте, ${predefinedName}. Выберите, пожалуйста, тему для обсуждения.`,
    'bot');
  showScreen('topicSelectionContainer');
}

function selectTopic(topic) {
  selectedTopic = topic;
  currentDatabase = DATABASES[topic] || null;
  currentQuestionIndex = 0;
  errorCount = 0;
  botReplyCount = 0;
  skipOffered = false;
  probeStage = 0;
  probeQuestions = [];
  confusedCount = 0;
  stage = "question";

  if (currentDatabase && Array.isArray(currentDatabase.questions)) {
    currentDatabase.questions = shuffleArray(currentDatabase.questions);
  }

  showScreen(null);

  appendMessage("Code-bot",
    `Вы выбрали тему «${currentDatabase.topicName}». Готовы начать обсуждение?`,
    'bot');
  showQuestion(`Вы выбрали тему «${currentDatabase.topicName}». Готовы начать?`);
}

function showQuestion(text) {
  document.getElementById('questionText').textContent = text;
  document.getElementById('questionContainer').style.display = 'block';
}

function hideQuestion() {
  document.getElementById('questionContainer').style.display = 'none';
}

function confirmStartTopic(isYes) {
  hideQuestion();

  if (isYes) {
    appendMessage(predefinedName, "Да", 'user');
    stage = "chat";

    if (!currentDatabase || !currentDatabase.questions || currentDatabase.questions.length === 0) {
      setTimeout(() => {
        appendMessage("Code-bot", "База вопросов по этой теме пока пуста.", 'bot');
      }, 600);
      return;
    }

    setTimeout(() => {
      const greet = pickReply('greeting');
      if (greet) appendMessage("Code-bot", greet, 'bot');
    }, 500);

    setTimeout(() => askCurrentQuestion(), 1400);

  } else {
    appendMessage(predefinedName, "Нет", 'user');
    stage = "topic";
    currentDatabase = null;
    setTimeout(() => {
      showScreen('topicSelectionContainer');
      appendMessage("Code-bot", "Хорошо. Выберите, пожалуйста, другую тему.", 'bot');
    }, 400);
  }
}

function askCurrentQuestion() {
  if (!currentDatabase) return;
  const q = currentDatabase.questions[currentQuestionIndex];
  if (!q) { finishTopic(); return; }

  errorCount = 0;
  botReplyCount = 0;
  skipOffered = false;
  probeStage = 0;
  probeQuestions = [];
  confusedCount = 0;

  appendMessage("Code-bot", q.question, 'bot');
  updateProgress();
}

function finishTopic() {
  const farewell = pickReply('farewell');
  appendMessage("Code-bot",
    farewell || "На этом наше обсуждение завершено. Благодарю вас за работу.",
    'bot');
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  appendMessage(predefinedName, text, 'user');
  input.value = '';

  const q = currentDatabase.questions[currentQuestionIndex];
  if (!q) return;

  if (isEmotional(text)) {
    showSupportMenu();
    return;
  }

  if (isSkipRequest(text)) {
    appendMessage("Code-bot",
      "Хорошо, перейдём к следующему вопросу.",
      'bot');
    setTimeout(() => nextQuestion(), 1200);
    return;
  }

  if (isConfused(text)) {
    botReplyCount++;
    confusedCount++;

    let confuseReply = pickReply('studentConfused');
    let hint = "";

    if (confusedCount === 1) {
      // Первое «не знаю» — мягкая подсказка
      hint = q.hint1 || "";
    } else if (confusedCount === 2) {
      // Второе «не знаю» — конкретная наводка
      confuseReply = "Хорошо, давайте подойдём ближе.";
      hint = q.hint2 || "";
    } else {
      // Третье «не знаю» — раскрываем ответ и идём дальше
      appendMessage("Code-bot",
        "Ничего страшного. Вот как это можно понять: " + (q.explanation || "Давайте двинемся дальше."),
        'bot');
      setTimeout(() => nextQuestion(), 2000);
      return;
    }

    appendMessage("Code-bot", confuseReply + (hint ? " " + hint : ""), 'bot');
    checkSkipConditions();
    return;
  }
  function isSkipRequest(text) {
    const t = text.toLowerCase().replace(/[.,!?;:]+/g, ' ').replace(/\s+/g, ' ').trim();
    const markers = [
      "другой вопрос", "следующий вопрос", "другой", "следующий",
      "пропустить", "пропусти", "не хочу этот", "не этот вопрос",
      "смени вопрос", "поменяй вопрос", "дай другой", "задай другой",
      "давай другой", "перейдём", "перейдем", "дальше", "другое"
    ];
    return markers.some(m => t.includes(m));
  }

  if (isQuestion(text)) {
    botReplyCount++;
    appendMessage("Code-bot", pickReply('studentAsks'), 'bot');
    checkSkipConditions();
    return;
  }

  if (isOffTopic(text)) {
    const offTopicReply = pickReply('offTopic') ||
      "Прошу прощения, я не уловил связи вашего ответа с вопросом. Постарайтесь, пожалуйста, сформулировать мысль по существу — или скажите, что пока не знаете ответа.";
    appendMessage("Code-bot", offTopicReply, 'bot');
    return;
  }

  const isKeywordMatch = matchesKeywords(text, q.keywords);

  if (probeStage > 0) {
    botReplyCount++;

    if (probeStage === 1) {
      appendMessage("Code-bot", pickReply('correct'), 'bot');

      if (probeQuestions.length > 0) {
        probeStage = 2;
        const nextProbe = probeQuestions.shift();
        setTimeout(() => appendMessage("Code-bot", nextProbe, 'bot'), 700);
        return;
      } else {
        if (q.followUp && Math.random() < 0.5) {
          setTimeout(() => appendMessage("Code-bot", q.followUp, 'bot'), 700);
        }
        setTimeout(() => nextQuestion(), 1500);
        return;
      }
    } else {
      appendMessage("Code-bot", pickReply('correct'), 'bot');

      if (q.followUp && Math.random() < 0.5) {
        setTimeout(() => appendMessage("Code-bot", q.followUp, 'bot'), 700);
      }

      setTimeout(() => nextQuestion(), 1500);
      return;
    }
  }

  if (isKeywordMatch) {
    botReplyCount++;
    appendMessage("Code-bot", pickReply('correct'), 'bot');

    probeQuestions = pickProbes(2);
    probeStage = 1;

    if (probeQuestions.length > 0) {
      const firstProbe = probeQuestions.shift();
      setTimeout(() => appendMessage("Code-bot", firstProbe, 'bot'), 700);
    } else {
      if (q.followUp && Math.random() < 0.5) {
        setTimeout(() => appendMessage("Code-bot", q.followUp, 'bot'), 700);
      }
      setTimeout(() => nextQuestion(), 1500);
    }
    return;
  }

  errorCount++;
  botReplyCount++;

  if (errorCount === 1) {
    appendMessage("Code-bot", pickReply('wrongSoft') + " " + (q.hint1 || ""), 'bot');
  } else if (errorCount === 2) {
    appendMessage("Code-bot", pickReply('wrongHard') + " " + (q.hint2 || ""), 'bot');
  } else {
    appendMessage("Code-bot", q.explanation || "Давайте двинемся дальше.", 'bot');
    setTimeout(() => nextQuestion(), 1500);
    return;
  }

  checkSkipConditions();
}

function pickProbes(n) {
  if (!currentDatabase || !currentDatabase.replies) return [];
  const pool = currentDatabase.replies.probes;
  if (!Array.isArray(pool) || pool.length === 0) return [];

  const shuffled = shuffleArray(pool);
  return shuffled.slice(0, Math.min(n, shuffled.length));
}

function checkSkipConditions() {
  if (botReplyCount >= 12) {
    appendMessage("Code-bot", pickReply('skipForce'), 'bot');
    setTimeout(() => nextQuestion(), 1200);
    return;
  }
  if (botReplyCount >= 7 && !skipOffered) {
    skipOffered = true;
    appendMessage("Code-bot", pickReply('skipOffer'), 'bot');
  }
}

function nextQuestion() {
  currentQuestionIndex++;
  errorCount = 0;
  botReplyCount = 0;
  skipOffered = false;
  probeStage = 0;
  probeQuestions = [];

  if (currentQuestionIndex > 0 && currentQuestionIndex % 5 === 0) {
    const ref = pickReply('reflection');
    if (ref) appendMessage("Code-bot", ref, 'bot');
  }

  const trans = pickReply('transition');
  if (trans) appendMessage("Code-bot", trans, 'bot');

  setTimeout(() => askCurrentQuestion(), 1000);
}

function handleSupportChoice(action, menuEl) {

  // Убираем меню
  if (menuEl) menuEl.remove();

  const choiceLabels = {
    hint: "Подсказку",
    hint2: "Подсказку подробнее",
    skip: "Другой вопрос"
  };
  appendMessage(predefinedName, choiceLabels[action] || "Хорошо", 'user');

  if (action === 'hint') {
    setTimeout(() => {
      appendMessage("Code-bot",
        (q.hint1 || "Попробуйте подойти с другой стороны."),
        'bot');
    }, 500);
  } else if (action === 'hint2') {
    setTimeout(() => {
      appendMessage("Code-bot",
        (q.hint2 || q.hint1 || "Вот более конкретная подсказка. Подумайте ещё раз."),
        'bot');
    }, 500);
  } else if (action === 'skip') {
    setTimeout(() => {
      appendMessage("Code-bot", "Хорошо, перейдём к следующему вопросу.", 'bot');
      setTimeout(() => nextQuestion(), 1000);
    }, 500);
  }
}

function isQuestion(text) {
  const t = text.trim().toLowerCase();
  if (t.includes('?')) return true;
  const starters = ['что ', 'почему ', 'как ', 'зачем ', 'когда ', 'где ',
                    'а что', 'а как', 'а почему', 'можно ли', 'а если'];
  return starters.some(s => t.startsWith(s));
}

function isOffTopic(text) {
  const t = text.trim();
  if (t.length < 3) return true;

  const hasWord = /[а-яёa-z]{3,}/i.test(t);
  if (!hasWord) return true;

  const garbagePatterns = [
    /^[qwertyuiopasdfghjklzxcvbnm]{4,}$/i,
    /^[йцукенгшщзфывапролджэячсмитьбю]{4,}$/i,
    /^(\d+)$/,
    /^([^\wа-яё]+)$/i
  ];
  return garbagePatterns.some(p => p.test(t.replace(/\s/g, '')));
}

function matchesKeywords(text, keywords) {
  if (!keywords || keywords.length === 0) return false;
  const t = text.toLowerCase();
  return keywords.some(k => t.includes(k.toLowerCase()));
}

function pickReply(category) {
  if (!currentDatabase || !currentDatabase.replies) return '';
  const pool = currentDatabase.replies[category];
  if (!Array.isArray(pool) || pool.length === 0) return '';
  return pool[Math.floor(Math.random() * pool.length)];
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function handleKeyPress(e) {
  if (e.key === 'Enter') sendMessage();
}

function appendMessage(sender, text, type) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ' + type;

  const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

  div.innerHTML = `${escapeHtml(text)}<span class="message-time">${time}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  logDialogue(sender, text);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function logDialogue(sender, text) {
  const time = new Date().toLocaleTimeString('ru-RU');
  dialogueHistory.push(`[${time}] ${sender}: ${text}`);
}

function endSession() {
  if (!confirm("Завершить сессию и скачать отчет?")) return;

  const now = new Date();
  const dateStr = now.toLocaleDateString('ru-RU');
  const timeStr = now.toLocaleTimeString('ru-RU', {
    hour: '2-digit', minute: '2-digit'
  }).replace(':', '-');

  let report = "Отчет о сессии\n";
  report += `Студент: ${predefinedName}\n`;
  report += `Тема: ${selectedTopic ? DATABASES[selectedTopic].topicName : "—"}\n`;
  report += `Дата: ${dateStr}\n`;
  report += `Время формирования отчета: ${now.toLocaleTimeString('ru-RU')}\n\n`;
  report += dialogueHistory.join('\n');

  const blob = new Blob([report], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Отчет_${predefinedName}_${dateStr}_${timeStr}.txt`;
  a.click();
  URL.revokeObjectURL(url);

  setTimeout(() => resetApp(), 300);
}
</script>
